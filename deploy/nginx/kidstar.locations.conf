# Include these locations in each public HTTP/HTTPS server block.

location = /kidstar {
  return 301 /kidstar/;
}

# Administrative scans are run from the private Docker network, never exposed.
location ^~ /kidstar/api/v1/admin/ {
  return 404;
}

location ^~ /kidstar/api/ {
  proxy_pass http://kids-planet-be:8888/api/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_read_timeout 1h;
}

location ^~ /kidstar/ {
  proxy_pass http://kids-planet-fe:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
