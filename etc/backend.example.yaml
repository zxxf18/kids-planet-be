Name: kids-media-api
Host: 127.0.0.1
Port: 8888
PublicBasePath: ""

Database:
  DSN: kids_media:change-me@tcp(127.0.0.1:3306)/kids_media?charset=utf8mb4&parseTime=true&loc=Local

Media:
  ResourceRoot: ./resources
  GeneratedRoot: ./runtime/generated
  FFprobePath: ffprobe
  FFmpegPath: ffmpeg

Storage:
  # local 用于本地联调；minio 用于服务器。原始媒体不会重复上传。
  Mode: local
  MinIO:
    Endpoint: minio.example.com
    AccessKey: change-me
    SecretKey: change-me
    Prefix: ""
    UseSSL: true
    URLExpiryMinutes: 60
    Buckets:
      Audio: song
      Video: video
      Lyric: lyr_img
      Poster: poster
