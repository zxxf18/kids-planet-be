Name: kids-planet-api
Host: 0.0.0.0
Port: 8888
PublicBasePath: /kidstar

Database:
  DSN: ${KIDS_DB_DSN}

Media:
  ResourceRoot: /data/resources
  GeneratedRoot: /data/generated
  FFprobePath: ffprobe
  FFmpegPath: ffmpeg

Storage:
  Mode: minio
  MinIO:
    Endpoint: minio:9000
    AccessKey: ${KIDS_MINIO_ACCESS_KEY}
    SecretKey: ${KIDS_MINIO_SECRET_KEY}
    Prefix: ""
    UseSSL: false
    URLExpiryMinutes: 60
    Buckets:
      Audio: song
      Video: video
      Lyric: lyr_img
      Poster: poster
